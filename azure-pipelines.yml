# Azure DevOps pipeline (starter)
# Note: update paths once src/api and src/web are scaffolded.

trigger:
- main

pool:
  vmImage: 'windows-latest'

stages:
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'

    - script: dotnet --info
      displayName: 'dotnet info'

